name: Verify and release zip

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  PLUGIN_SLUG: cf7-telegram
  ZIP_PATH: dist/cf7-telegram-wp-plugin.zip

jobs:
  verify:
    name: Verify source and release zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:2.10.3

      - name: Configure Composer GitHub token
        run: composer config --global --auth github-oauth.github.com "${{ github.token }}"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugin-dir/react/package-lock.json

      - name: Install Composer dependencies for tests
        working-directory: ./plugin-dir
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP lint
        run: find plugin-dir -type f -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n 1 php -l

      - name: Run Composer test suite
        working-directory: ./plugin-dir
        run: composer test

      - name: Install React dependencies
        working-directory: ./plugin-dir/react
        run: npm ci

      - name: Run React tests
        working-directory: ./plugin-dir/react
        run: CI=true npm test -- --watchAll=false

      - name: Run release dependency audit gates
        run: scripts/run-release-audits.sh

      - name: Upload release audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cf7-telegram-release-audit-reports
          path: dist/audit-reports
          if-no-files-found: warn

      - name: Prepare release version gate
        id: release_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="$(printf '%s' "$version" | sed -E 's/^(v|version)-?//')"
            echo "value=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate release zip
        run: EXPECTED_VERSION="${{ steps.release_version.outputs.value }}" scripts/build-release-zip.sh

      - name: Verify release zip reproducibility
        shell: bash
        run: |
          reference_zip="${RUNNER_TEMP}/cf7-telegram-reference.zip"
          cp "${ZIP_PATH}" "$reference_zip"
          EXPECTED_VERSION="${{ steps.release_version.outputs.value }}" scripts/build-release-zip.sh

          if ! cmp -s "$reference_zip" "${ZIP_PATH}"; then
            sha256sum "$reference_zip" "${ZIP_PATH}"
            echo "Release ZIP is not reproducible." >&2
            exit 1
          fi

      - name: Run Plugin Check release gate
        env:
          CF7TG_CANDIDATE_ZIP: ${{ github.workspace }}/${{ env.ZIP_PATH }}
          CF7TG_EXPECTED_CANDIDATE_VERSION: ${{ steps.release_version.outputs.value }}
        run: tests/stability/e5-plugin-check-gate.sh

      - name: Run isolated current lifecycle smoke
        if: ${{ github.event_name != 'release' }}
        env:
          CF7TG_CANDIDATE_ZIP: ${{ github.workspace }}/${{ env.ZIP_PATH }}
          CF7TG_EXPECTED_CANDIDATE_VERSION: ${{ steps.release_version.outputs.value }}
        run: tests/stability/e1-smoke-matrix.sh

      - name: Run supported release lifecycle matrix
        if: ${{ github.event_name == 'release' }}
        env:
          CF7TG_CANDIDATE_ZIP: ${{ github.workspace }}/${{ env.ZIP_PATH }}
          CF7TG_EXPECTED_CANDIDATE_VERSION: ${{ steps.release_version.outputs.value }}
          CF7TG_E5_SUPPORT_MATRIX_RESULTS_DIR: ${{ github.workspace }}/test-evidence/support-matrix
        run: tests/stability/e5-support-matrix.sh

      - name: Upload support matrix evidence
        if: ${{ always() && github.event_name == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: cf7-telegram-support-matrix-evidence
          path: test-evidence/support-matrix
          if-no-files-found: error

      - name: Run real WordPress REST integration smoke
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'release' }}
        env:
          CF7TG_CANDIDATE_ZIP: ${{ github.workspace }}/${{ env.ZIP_PATH }}
          CF7TG_EXPECTED_CANDIDATE_VERSION: ${{ steps.release_version.outputs.value }}
          CF7TG_E4_SMOKE_RESULTS_DIR: ${{ github.workspace }}/test-evidence/rest-integration
        run: tests/stability/e4-rest-ui-smoke.sh

      - name: Run authenticated browser canary
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'release' }}
        env:
          CF7TG_CANDIDATE_ZIP: ${{ github.workspace }}/${{ env.ZIP_PATH }}
          CF7TG_EXPECTED_CANDIDATE_VERSION: ${{ steps.release_version.outputs.value }}
          CF7TG_E5_BROWSER_RESULTS_DIR: ${{ github.workspace }}/test-evidence/browser
        run: tests/stability/e5-browser-smoke.sh

      - name: Run fake Telegram form delivery E2E
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'release' }}
        env:
          CF7TG_CANDIDATE_ZIP: ${{ github.workspace }}/${{ env.ZIP_PATH }}
          CF7TG_EXPECTED_CANDIDATE_VERSION: ${{ steps.release_version.outputs.value }}
          CF7TG_E6_RESULTS_DIR: ${{ github.workspace }}/test-evidence/fake-telegram-e2e
        run: tests/stability/e6-form-delivery-smoke.sh --skip-browser-install

      - name: Upload fake Telegram E2E evidence
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: cf7-telegram-fake-telegram-e2e-evidence
          path: test-evidence/fake-telegram-e2e
          if-no-files-found: error

      - name: Upload browser canary evidence
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: cf7-telegram-browser-evidence
          path: test-evidence/browser
          if-no-files-found: error

      - name: Upload REST integration evidence
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: cf7-telegram-rest-integration-evidence
          path: test-evidence/rest-integration
          if-no-files-found: error

      - name: Upload verified zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf7-telegram-wp-plugin
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  publish:
    name: Publish verified release
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified zip artifact
        uses: actions/download-artifact@v4
        with:
          name: cf7-telegram-wp-plugin
          path: dist

      - name: Validate downloaded release zip
        run: EXPECTED_VERSION="${{ needs.verify.outputs.release_version }}" scripts/validate-release-zip.sh "${ZIP_PATH}"

      - name: Unpack verified plugin
        run: |
          rm -rf release-work
          mkdir -p release-work
          unzip -q "${ZIP_PATH}" -d release-work

      - name: Upload Release Artifact
        run: gh release upload "${{ github.event.release.tag_name }}" "${ZIP_PATH}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install WordPress.org SVN deploy tools
        if: ${{ github.event.release.prerelease == false }}
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion rsync

      - name: Deploy final release to WordPress.org SVN
        if: ${{ github.event.release.prerelease == false }}
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          BUILD_DIR: ${{ github.workspace }}/release-work/cf7-telegram
          SLUG: cf7-telegram
          VERSION: ${{ needs.verify.outputs.release_version }}
        run: scripts/deploy-wordpress-svn.sh

      - name: Update stable mirror after WordPress.org succeeds
        if: ${{ github.event.release.prerelease == false }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin stable
          git worktree add --force stable-worktree origin/stable

          find stable-worktree -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          rsync -a --delete --exclude '.git' release-work/cf7-telegram/ stable-worktree/

          cd stable-worktree
          git add -A
          git add -f vendor react/build

          if git diff --cached --quiet; then
            echo "Stable mirror already matches $RELEASE_TAG"
          else
            git commit -m "Update plugin build from release $RELEASE_TAG"
            git push origin HEAD:stable
          fi

      - name: Push prerelease canary to plugin-dist
        if: ${{ github.event.release.prerelease == true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin plugin-dist
          git worktree add --force dist-worktree origin/plugin-dist

          find dist-worktree -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          rsync -a --delete --exclude '.git' release-work/cf7-telegram/ dist-worktree/

          cd dist-worktree
          git add -A
          git add -f vendor react/build

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update plugin build from release ${{ github.event.release.tag_name }}"
            git push origin HEAD:plugin-dist
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
