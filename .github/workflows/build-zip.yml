name: Verify and release zip

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  PLUGIN_SLUG: cf7-telegram
  ZIP_PATH: dist/cf7-telegram-wp-plugin.zip

jobs:
  verify:
    name: Verify source and release zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Configure Composer GitHub token
        run: composer config --global --auth github-oauth.github.com "${{ github.token }}"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: plugin-dir/react/package-lock.json

      - name: Install Composer dependencies for tests
        working-directory: ./plugin-dir
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP lint
        run: find plugin-dir -type f -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n 1 php -l

      - name: Run Composer test suite
        working-directory: ./plugin-dir
        run: composer test

      - name: Install React dependencies
        working-directory: ./plugin-dir/react
        run: npm ci

      - name: Run React tests
        working-directory: ./plugin-dir/react
        run: CI=true npm test -- --watchAll=false

      - name: Prepare release version gate
        id: release_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="$(printf '%s' "$version" | sed -E 's/^(v|version)-?//')"
            echo "value=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate release zip
        run: EXPECTED_VERSION="${{ steps.release_version.outputs.value }}" scripts/build-release-zip.sh

      - name: Run isolated stability matrix
        env:
          CF7TG_CANDIDATE_ZIP: ${{ github.workspace }}/${{ env.ZIP_PATH }}
          CF7TG_EXPECTED_CANDIDATE_VERSION: ${{ steps.release_version.outputs.value }}
        run: tests/stability/e1-smoke-matrix.sh

      - name: Upload verified zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf7-telegram-wp-plugin
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  publish:
    name: Publish verified release
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified zip artifact
        uses: actions/download-artifact@v4
        with:
          name: cf7-telegram-wp-plugin
          path: dist

      - name: Validate downloaded release zip
        run: EXPECTED_VERSION="${{ needs.verify.outputs.release_version }}" scripts/validate-release-zip.sh "${ZIP_PATH}"

      - name: Unpack verified plugin
        run: |
          rm -rf release-work
          mkdir -p release-work
          unzip -q "${ZIP_PATH}" -d release-work

      - name: Upload Release Artifact
        run: gh release upload "${{ github.event.release.tag_name }}" "${ZIP_PATH}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set target branch
        id: branch
        run: echo "branch_name=$([ '${{ github.event.release.prerelease }}' = 'true' ] && echo 'plugin-dist' || echo 'stable')" >> "$GITHUB_OUTPUT"

      - name: Push to release branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${{ steps.branch.outputs.branch_name }}"
          git worktree add --force dist-worktree "origin/${{ steps.branch.outputs.branch_name }}"

          find dist-worktree -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          rsync -a --delete --exclude '.git' release-work/cf7-telegram/ dist-worktree/

          cd dist-worktree
          git add -A
          git add -f vendor react/build

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update plugin build from release ${{ github.event.release.tag_name }}"
            git push origin HEAD:${{ steps.branch.outputs.branch_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to WordPress.org (production only)
        if: ${{ github.event.release.prerelease == false }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          BUILD_DIR: ./release-work/cf7-telegram
          SLUG: cf7-telegram
          VERSION: ${{ needs.verify.outputs.release_version }}
