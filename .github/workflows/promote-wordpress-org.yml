name: Promote verified release to WordPress.org

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Final, non-prerelease GitHub release tag
        required: true
        type: string
      canary_run_id:
        description: Successful prerelease canary workflow run ID for the same commit and ZIP
        required: true
        type: string
      candidate_sha256:
        description: Approved exact candidate ZIP SHA-256
        required: true
        type: string
      rollback_version:
        description: Current WordPress.org version to restore on rollback
        required: true
        type: string
      rollback_sha256:
        description: WordPress.org rollback ZIP SHA-256
        required: true
        type: string
      db_snapshot_sha256:
        description: Canary pre-upgrade database snapshot SHA-256
        required: true
        type: string
      confirmation:
        description: Enter PROMOTE followed by a space and the release version
        required: true
        type: string

concurrency:
  group: cf7-telegram-wordpress-org-production
  cancel-in-progress: false

env:
  PLUGIN_SLUG: cf7-telegram
  PROMOTION_BUNDLE: cf7-telegram-wordpress-promotion

jobs:
  verify-promotion:
    name: Verify canary, rollback and exact candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      candidate_sha256: ${{ steps.gate.outputs.candidate_sha256 }}

    steps:
      - name: Check out trusted promotion tooling
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve final release and successful prerelease canary
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANARY_RUN_ID: ${{ inputs.canary_run_id }}
          EXPECTED_SHA256: ${{ inputs.candidate_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$CANARY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid canary run ID" >&2; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Invalid candidate SHA-256" >&2; exit 1; }

          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)"
          [ "$(jq -r '.isDraft' <<<"$release_json")" = "false" ]
          [ "$(jq -r '.isPrerelease' <<<"$release_json")" = "false" ]

          version="$(jq -r '.tagName' <<<"$release_json" | sed -E 's/^(v|version)-?//')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid final release version" >&2; exit 1; }
          [ "$CONFIRMATION" = "PROMOTE $version" ] || { echo "Confirmation must be: PROMOTE $version" >&2; exit 1; }

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANARY_RUN_ID}")"
          [ "$(jq -r '.conclusion' <<<"$run_json")" = "success" ]
          [ "$(jq -r '.event' <<<"$run_json")" = "release" ]
          [ "$(jq -r '.head_sha' <<<"$run_json")" = "$release_sha" ]

          canary_tag="$(jq -r '.head_branch' <<<"$run_json")"
          canary_json="$(gh release view "$canary_tag" --json isDraft,isPrerelease)"
          [ "$(jq -r '.isDraft' <<<"$canary_json")" = "false" ]
          [ "$(jq -r '.isPrerelease' <<<"$canary_json")" = "true" ]

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(tr '[:upper:]' '[:lower:]' <<<"$EXPECTED_SHA256")" >> "$GITHUB_OUTPUT"
          echo "canary_tag=$canary_tag" >> "$GITHUB_OUTPUT"

      - name: Download final, canary and test evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANARY_RUN_ID: ${{ inputs.canary_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p promotion/final promotion/canary promotion/support promotion/browser
          gh release download "$RELEASE_TAG" --pattern 'cf7-telegram-wp-plugin.zip' --dir promotion/final
          gh run download "$CANARY_RUN_ID" --name cf7-telegram-wp-plugin --dir promotion/canary
          gh run download "$CANARY_RUN_ID" --name cf7-telegram-support-matrix-evidence --dir promotion/support
          gh run download "$CANARY_RUN_ID" --name cf7-telegram-browser-evidence --dir promotion/browser

      - name: Download and verify factual WordPress.org rollback baseline
        env:
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ROLLBACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid rollback version" >&2; exit 1; }
          current_version="$(curl -fsSL 'https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request%5Bslug%5D=cf7-telegram' | jq -r '.version')"
          [ "$current_version" = "$ROLLBACK_VERSION" ] || {
            echo "WordPress.org reports $current_version, not rollback baseline $ROLLBACK_VERSION" >&2
            exit 1
          }
          curl -fsSL "https://downloads.wordpress.org/plugin/cf7-telegram.${ROLLBACK_VERSION}.zip" -o promotion/rollback.zip

      - name: Verify promotion evidence fail closed
        env:
          CANDIDATE_ZIP: promotion/final/cf7-telegram-wp-plugin.zip
          CANARY_ZIP: promotion/canary/cf7-telegram-wp-plugin.zip
          SUPPORT_SUMMARY: promotion/support/summary.json
          BROWSER_SUMMARY: promotion/browser/summary.json
          ROLLBACK_ZIP: promotion/rollback.zip
          DB_SNAPSHOT: promotion/support/rollback.sql
          EXPECTED_VERSION: ${{ steps.gate.outputs.version }}
          EXPECTED_SHA256: ${{ steps.gate.outputs.candidate_sha256 }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          ROLLBACK_SHA256: ${{ inputs.rollback_sha256 }}
          DB_SNAPSHOT_SHA256: ${{ inputs.db_snapshot_sha256 }}
          OUTPUT_FILE: promotion/promotion-evidence.json
        run: scripts/verify-promotion-evidence.sh

      - name: Validate exact final ZIP
        run: EXPECTED_VERSION="${{ steps.gate.outputs.version }}" scripts/validate-release-zip.sh promotion/final/cf7-telegram-wp-plugin.zip

      - name: Upload immutable promotion bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROMOTION_BUNDLE }}
          path: promotion
          if-no-files-found: error
          retention-days: 30

  deploy-wordpress-org:
    name: Manually approved WordPress.org deployment
    needs: verify-promotion
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: wordpress-org-production
      url: https://wordpress.org/plugins/cf7-telegram/

    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download verified promotion bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROMOTION_BUNDLE }}
          path: promotion

      - name: Recheck immutable candidate
        env:
          EXPECTED_SHA256: ${{ needs.verify-promotion.outputs.candidate_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_sha256="$(sha256sum promotion/final/cf7-telegram-wp-plugin.zip | awk '{print $1}')"
          [ "$actual_sha256" = "$EXPECTED_SHA256" ]
          EXPECTED_VERSION="${{ needs.verify-promotion.outputs.version }}" scripts/validate-release-zip.sh promotion/final/cf7-telegram-wp-plugin.zip
          mkdir -p release-work
          unzip -q promotion/final/cf7-telegram-wp-plugin.zip -d release-work

      - name: Deploy exact candidate to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          BUILD_DIR: ${{ github.workspace }}/release-work/cf7-telegram
          SLUG: cf7-telegram
          VERSION: ${{ needs.verify-promotion.outputs.version }}
        run: scripts/deploy-wordpress-svn.sh

      - name: Update stable mirror after WordPress.org succeeds
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin stable
          git worktree add --force stable-worktree origin/stable
          find stable-worktree -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          rsync -a --delete --exclude '.git' release-work/cf7-telegram/ stable-worktree/
          cd stable-worktree
          git add -A
          git add -f vendor react/build
          if git diff --cached --quiet; then
            echo "Stable mirror already matches $RELEASE_TAG"
          else
            git commit -m "Update plugin build from release $RELEASE_TAG"
            git push origin HEAD:stable
          fi
